<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avendor: The Rising Tides | Early Test</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/avendor.css">
  <link rel="stylesheet" href="css/garius.css">
  <link rel="preload" as="image" href="assets/cinematic/scene-01-moons-master.png">
  <link rel="preload" as="image" href="assets/cinematic/scene-02-barrens-final.png">
  <link rel="preload" as="audio" href="assets/cinematic/avendor-sarabande-of-the-north-v7.ogg" type="audio/ogg">
  <link rel="preload" as="audio" href="assets/cinematic/scene-02-barrens-ambience.ogg" type="audio/ogg">
  <link rel="preload" as="image" href="assets/cinematic/scene-03-bruntide-final.png">
</head>
<body>
  <main
    class="avendor-stage title-stage"
    id="avendor-title-stage"
    style="--stage-ratio: 1672 / 941"
    aria-label="Avendor early test title screen"
  >
    <img
      class="stage-art"
      src="assets/rising-tides-intro.png"
      alt="The Rising Tides of Avendor title screen, overlooking snowy Briarwell"
    >

    <!-- GARIUS: independent title-screen support NPC. -->
    <div
      class="garius-title-npc"
      id="garius-title-npc"
      data-pose="idle"
      aria-label="Garius, a weary adventurer sitting beneath the Briarwell sign"
    >
      <img class="garius-pose garius-pose-idle is-active" data-garius-pose="idle" src="assets/garius/garius-idle.png" alt="" draggable="false" aria-hidden="true">
      <img class="garius-pose garius-pose-present" data-garius-pose="present" src="assets/garius/garius-present.png" alt="" draggable="false" aria-hidden="true">
      <img class="garius-pose garius-pose-raise" data-garius-pose="raise" src="assets/garius/garius-raise.png" alt="" draggable="false" aria-hidden="true">
    </div>

    <a
      class="garius-hat-hitbox"
      id="garius-hat-hitbox"
      href="https://ko-fi.com/myrpgsource"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Spare a coin for Garius and support Avendor"
      title="Spare a coin for Garius"
      data-analytics-event="support_click"
      data-analytics-id="avendor_garius_hat"
    ></a>

    <a
      class="garius-bubble"
      id="garius-bubble"
      href="https://ko-fi.com/myrpgsource"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Support Avendor on Ko-fi"
      data-analytics-event="support_click"
      data-analytics-id="avendor_garius_bubble"
      aria-hidden="true"
      tabindex="-1"
    ><span id="garius-bubble-text">Spare some coin for a weary game developer?</span></a>

    <section class="intro-cover-panel" id="title-menu" aria-label="Early test menu">
      <div class="title-menu-buttons">
        <button class="early-test-button" id="early-test" type="button">Early Test</button>
        <button class="early-test-button introduction-button" id="play-introduction" type="button">Introduction</button>
      </div>
    </section>

    <div class="test-ribbon" id="test-ribbon">
      Town Center 0.6.0 · NPC Art 0.1.0 · Hero Art 0.4.3 · Rig 0.4.0 · Garius</div>

    <section
      class="cinematic"
      id="avendor-cinematic"
      aria-label="The Rising Tides opening cinematic"
      aria-hidden="true"
    >
      <div class="cinematic-scene" id="cinematic-scene">
        <div class="cinematic-pan" id="cinematic-pan">
          <div class="cinematic-zoom" id="cinematic-zoom">
            <img
              class="cinematic-art"
              id="cinematic-art"
              alt=""
              draggable="false"
            >
            <canvas
              class="cinematic-stars"
              id="cinematic-stars"
              aria-hidden="true"
            ></canvas>

            <div
              class="cinematic-barrens-fx"
              id="cinematic-barrens-fx"
              aria-hidden="true"
            >
              <div class="cinematic-barrens-cave-glow"></div>
            </div>
          </div>
        </div>

        <div class="cinematic-wind" id="cinematic-wind" aria-hidden="true"></div>
        <canvas
          class="cinematic-barrens-gusts"
          id="cinematic-barrens-gusts"
          aria-hidden="true"
        ></canvas>
        <div class="cinematic-snow" id="cinematic-snow" aria-hidden="true"></div>
        <div class="cinematic-meteor" id="cinematic-meteor" aria-hidden="true"></div>
        <div
          class="cinematic-transition-wind"
          id="cinematic-transition-wind"
          aria-hidden="true"
        ></div>
      </div>

      <div class="cinematic-subtitle-wrap" aria-live="polite" aria-atomic="true">
        <p class="cinematic-subtitle" id="cinematic-subtitle"></p>
      </div>

      <div class="cinematic-skip">Click or press any key to skip</div>
    </section>
  </main>

  <audio id="avendor-music" preload="auto" loop>
    <source src="assets/bruckner-fourth-title-loop.ogg" type="audio/ogg">
    <source src="assets/bruckner-fourth-title-loop.mp3" type="audio/mpeg">
  </audio>

  <audio id="cinematic-music" preload="auto">
    <source
      src="assets/cinematic/avendor-sarabande-of-the-north-v7.ogg"
      type="audio/ogg"
    >
    <source
      src="assets/cinematic/avendor-sarabande-of-the-north-v7.mp3"
      type="audio/mpeg"
    >
  </audio>

  <audio
    id="scene-01-wind"
    src="assets/cinematic/scene-01-northern-wind.ogg"
    preload="auto"
    loop
  ></audio>

  <audio id="scene-02-barrens-ambience" preload="auto" loop>
    <source src="assets/cinematic/scene-02-barrens-ambience.ogg" type="audio/ogg">
    <source src="assets/cinematic/scene-02-barrens-ambience.mp3" type="audio/mpeg">
  </audio>

  <script src="js/cinematic.js"></script>
  <script src="js/garius.js"></script>
</body>
</html>
