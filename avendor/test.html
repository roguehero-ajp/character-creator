<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avendor: The Rising Tides | Early Test</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="css/avendor.css">
  <link rel="preload" as="image" href="assets/cinematic/scene-01-moons-master.png">
  <link rel="preload" as="audio" href="assets/cinematic/avendor-sarabande-of-the-north-v7.ogg" type="audio/ogg">
</head>
<body>
  <main
    class="avendor-stage title-stage"
    id="avendor-title-stage"
    style="--stage-ratio: 1672 / 941"
    aria-label="Avendor early test title screen"
  >
    <img
      class="stage-art"
      src="assets/rising-tides-intro.png"
      alt="The Rising Tides of Avendor title screen, overlooking snowy Briarwell"
    >

    <section class="intro-cover-panel" id="title-menu" aria-label="Early test menu">
      <button class="early-test-button" id="early-test" type="button">Early Test</button>
    </section>

    <div class="test-ribbon" id="test-ribbon">
      prototype 0.2.2 · idle 10 seconds for intro
    </div>

    <section
      class="cinematic"
      id="avendor-cinematic"
      aria-label="The Rising Tides opening cinematic"
      aria-hidden="true"
    >
      <div class="cinematic-scene" id="cinematic-scene">
        <div class="cinematic-pan" id="cinematic-pan">
          <div class="cinematic-zoom" id="cinematic-zoom">
            <img
              class="cinematic-art"
              id="cinematic-art"
              alt=""
              draggable="false"
            >
            <canvas
              class="cinematic-stars"
              id="cinematic-stars"
              aria-hidden="true"
            ></canvas>
          </div>
        </div>

        <div class="cinematic-wind" id="cinematic-wind" aria-hidden="true"></div>
        <div class="cinematic-snow" id="cinematic-snow" aria-hidden="true"></div>
        <div class="cinematic-meteor" id="cinematic-meteor" aria-hidden="true"></div>
        <div
          class="cinematic-transition-wind"
          id="cinematic-transition-wind"
          aria-hidden="true"
        ></div>
      </div>

      <div class="cinematic-subtitle-wrap" aria-live="polite" aria-atomic="true">
        <p class="cinematic-subtitle" id="cinematic-subtitle"></p>
      </div>

      <div class="cinematic-skip">Click or press any key to skip</div>
    </section>
  </main>

  <audio id="avendor-music" preload="auto" loop>
    <source src="assets/bruckner-fourth-title-loop.ogg" type="audio/ogg">
    <source src="assets/bruckner-fourth-title-loop.mp3" type="audio/mpeg">
  </audio>

  <audio id="cinematic-music" preload="auto">
    <source
      src="assets/cinematic/avendor-sarabande-of-the-north-v7.ogg"
      type="audio/ogg"
    >
    <source
      src="assets/cinematic/avendor-sarabande-of-the-north-v7.mp3"
      type="audio/mpeg"
    >
  </audio>

  <audio
    id="scene-01-wind"
    src="assets/cinematic/scene-01-northern-wind.ogg"
    preload="auto"
    loop
  ></audio>

  <script src="js/cinematic.js"></script>
</body>
</html>
