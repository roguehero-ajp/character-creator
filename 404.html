<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | My RPG Source</title>

  <meta
    name="description"
    content="The requested page could not be found on My RPG Source."
  >

  <!-- Keep the error page out of search results, while allowing its links to be followed. -->
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background-deep: #111922;
      --background-mid: #18232f;
      --background-light: #203244;
      --panel: rgba(244, 236, 216, 0.07);
      --text: #f5f0e6;
      --muted: rgba(245, 240, 230, 0.78);
      --gold: #f1c40f;
      --warm-gold: #dda15e;
      --border: rgba(245, 240, 230, 0.16);
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;

      padding: 24px;

      color: var(--text);
      font-family: "Lora", serif;

      background:
        radial-gradient(
          circle at top,
          rgba(241, 196, 15, 0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 15% 75%,
          rgba(221, 161, 94, 0.1),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          var(--background-light) 0%,
          var(--background-mid) 55%,
          var(--background-deep) 100%
        );
    }

    a {
      color: inherit;
    }

    .error-card {
      width: min(880px, 100%);

      padding: clamp(24px, 5vw, 48px);

      text-align: center;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 26px;

      box-shadow:
        0 24px 60px var(--shadow);

      backdrop-filter: blur(10px);
    }

    .error-code {
      margin: 0 0 8px;

      color: var(--gold);

      font-family: "Cinzel", serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 700;
      line-height: 1;

      letter-spacing: 0.08em;

      text-shadow:
        0 3px 18px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0 0 18px;

      font-family: "Cinzel", serif;
      font-size: clamp(1.7rem, 4vw, 2.65rem);
      line-height: 1.2;
    }

    .message {
      max-width: 690px;

      margin: 0 auto 28px;

      color: var(--muted);

      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.75;
    }

    .penguin-frame {
      width: min(460px, 100%);

      margin: 0 auto 30px;
      padding: 10px;

      background:
        linear-gradient(
          145deg,
          rgba(241, 196, 15, 0.18),
          rgba(221, 161, 94, 0.05)
        );

      border: 1px solid rgba(241, 196, 15, 0.35);
      border-radius: 22px;

      box-shadow:
        0 16px 36px rgba(0, 0, 0, 0.32);
    }

    .penguin-frame img {
      display: block;

      width: 100%;
      height: auto;

      border-radius: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 48px;
      padding: 12px 19px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--text);
      font-weight: 700;
      text-decoration: none;

      background:
        rgba(255, 255, 255, 0.05);

      transition:
        transform 160ms ease,
        border-color 160ms ease,
        background 160ms ease;
    }

    .button-primary {
      color: #17212c;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--warm-gold)
        );

      border-color:
        rgba(241, 196, 15, 0.8);
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);

      border-color:
        rgba(241, 196, 15, 0.75);

      background:
        rgba(255, 255, 255, 0.1);
    }

    .button-primary:hover,
    .button-primary:focus-visible {
      background:
        linear-gradient(
          135deg,
          #f7d84b,
          #e6b477
        );
    }

    .button:focus-visible {
      outline:
        3px solid rgba(241, 196, 15, 0.45);

      outline-offset: 3px;
    }

    .footer-note {
      margin: 28px 0 0;

      color: rgba(245, 240, 230, 0.58);

      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .error-card {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="error-card">
    <p class="error-code" aria-label="Error 404">
      404
    </p>

    <h1>
      This Page Has Vanished
    </h1>

    <p class="message">
      Uh-oh! The wizards are still working on this one, it looks like.
      Unless they polymorphed it. Or disintegrated it...
    </p>

    <div class="penguin-frame">
      <!-- Root-relative path keeps the image working from deeply nested missing URLs. -->
      <img
        src="/images/penguin404.jpg"
        alt="A penguin illustrating the missing-page error"
      >
    </div>

    <nav class="actions" aria-label="Helpful destinations">
      <a class="button button-primary" href="/">
        Return Home
      </a>

      <a class="button" href="/builder.html?edition=2024">
        Open the Character Builder
      </a>

      <a class="button" href="/codex.html">
        Browse the Codex
      </a>
    </nav>

    <p class="footer-note">
      My RPG Source
    </p>
  </main>
</body>
</html>
