name: Repaint Sewer Area 15

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sewer-area15-painted-art-1.2
    paths:
      - '.github/workflows/repaint-sewer-area-15.yml'

permissions:
  contents: write

jobs:
  repaint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sewer-area15-painted-art-1.2
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build painterly Area 15 background
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageEnhance, ImageFilter
          from pathlib import Path

          root = Path('avendor/assets/maps/briarwell/sewers/background')
          base = Image.open(root / 'sewer-straight-ew-v1.png').convert('RGB').resize((1448,1086), Image.Resampling.LANCZOS)
          refs = [
              Image.open(root / 'sewer-area-14-v1.png').convert('RGB').resize((1448,1086), Image.Resampling.LANCZOS),
              Image.open(root / 'sewer-area-05-v1.png').convert('RGB').resize((1448,1086), Image.Resampling.LANCZOS),
              Image.open(root / 'sewer-area-07-v1.png').convert('RGB').resize((1448,1086), Image.Resampling.LANCZOS),
              Image.open(root / 'sewer-straight-ew-v1.png').convert('RGB').resize((1448,1086), Image.Resampling.LANCZOS),
          ]

          tiles=[]
          for i, ref in enumerate(refs):
              tile = Image.blend(base, ref, 0.24 if i < 3 else 0.08)
              tile = ImageEnhance.Contrast(tile).enhance(1.06)
              tile = ImageEnhance.Color(tile).enhance(0.96)
              if i == 0:
                  warm = Image.new('RGB', tile.size, (84,44,27))
                  tile = Image.blend(tile, warm, 0.08)
              elif i == 3:
                  cool = Image.new('RGB', tile.size, (23,42,44))
                  tile = Image.blend(tile, cool, 0.045)
              tiles.append(tile)

          # Seal the west edge of the final chamber by replacing the original west opening
          # with mirrored masonry sampled from the same high-resolution sewer painting.
          left = tiles[0].copy()
          patch = left.crop((215, 0, 455, 1086)).transpose(Image.Transpose.FLIP_LEFT_RIGHT)
          left.paste(patch, (0,0))

          # Add a restrained chieftain dais and banners without painting enemies into the background.
          overlay = Image.new('RGBA', left.size, (0,0,0,0))
          d = ImageDraw.Draw(overlay)
          d.rounded_rectangle((255,500,1120,745), radius=26, fill=(58,48,39,160), outline=(118,91,58,190), width=7)
          d.polygon([(335,500),(1040,500),(965,430),(410,430)], fill=(71,56,43,165), outline=(127,94,58,180))
          for bx in (310, 1015):
              d.polygon([(bx,150),(bx+92,150),(bx+92,390),(bx+46,350),(bx,390)], fill=(91,31,26,185), outline=(122,75,49,210))
              d.ellipse((bx+29,205,bx+63,239), outline=(176,137,86,220), width=4)
              d.line((bx+46,239,bx+46,310), fill=(176,137,86,220), width=4)
          overlay = overlay.filter(ImageFilter.GaussianBlur(0.35))
          left = Image.alpha_composite(left.convert('RGBA'), overlay).convert('RGB')
          tiles[0] = left

          # Stitch four screen-width sections with a soft painted crossfade at each seam.
          canvas = Image.new('RGB', (5792,1086))
          canvas.paste(tiles[0], (0,0))
          seam = 84
          for i in range(1,4):
              x=i*1448
              canvas.paste(tiles[i], (x,0))
              a = canvas.crop((x-seam,0,x,1086)).convert('RGBA')
              b = tiles[i].crop((0,0,seam,1086)).convert('RGBA')
              mask = Image.new('L',(seam,1086))
              md=ImageDraw.Draw(mask)
              for sx in range(seam):
                  md.line((sx,0,sx,1086), fill=int(255*sx/(seam-1)))
              blended = Image.composite(b,a,mask).convert('RGB')
              canvas.paste(blended,(x-seam,0))

          # Final polish keeps the detail density closer to the original sewer paintings.
          canvas = ImageEnhance.Sharpness(canvas).enhance(1.12)
          canvas = ImageEnhance.Contrast(canvas).enhance(1.03)
          out = root / 'sewer-area-15-v2.png'
          canvas.save(out, 'PNG', optimize=True)
          print('saved', out, canvas.size)
          PY
      - name: Verify dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          p='avendor/assets/maps/briarwell/sewers/background/sewer-area-15-v2.png'
          im=Image.open(p)
          assert im.size == (5792,1086), im.size
          print('Verified', im.size)
          PY
      - name: Commit production PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avendor/assets/maps/briarwell/sewers/background/sewer-area-15-v2.png
          if git diff --cached --quiet; then
            echo "Area 15 PNG already current."
          else
            git commit -m "Upgrade Sewer Area 15 painted background"
            git push origin HEAD:codex/sewer-area15-painted-art-1.2
          fi
